<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DsrJrFoundation |Donate Now</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#1d2671,#c33764);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .donation-card{
      width:350px;
      background:#fff;
      border-radius:20px;
      padding:25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
      animation:fadeIn 1s ease;
      position:relative;
      overflow:hidden;
    }

    .donation-card::before{
      content:'';
      position:absolute;
      width:120px;
      height:120px;
      background:rgba(255,0,98,0.1);
      border-radius:50%;
      top:-40px;
      left:-40px;
    }

    .donation-card::after{
      content:'';
      position:absolute;
      width:140px;
      height:140px;
      background:rgba(0,123,255,0.1);
      border-radius:50%;
      bottom:-50px;
      right:-50px;
    }

    h1{
      color:#222;
      margin-bottom:10px;
      font-size:30px;
      z-index:1;
      position:relative;
    }

    p{
      color:#666;
      margin-bottom:20px;
      z-index:1;
      position:relative;
    }

    .scanner-box{
      background:#f7f7f7;
      padding:15px;
      border-radius:15px;
      margin-bottom:20px;
      z-index:1;
      position:relative;
    }

    .scanner-box img{
      width:220px;
      height:220px;
      object-fit:cover;
      border-radius:5px;
      border:4px solid #fff;
      box-shadow:0 4px 5px rgba(0,0,0,0.2);
    }

    .donate-btn{
      padding:14px 30px;
      background:linear-gradient(45deg,#ff416c,#ff4b2b);
      border:none;
      color:#fff;
      font-size:18px;
      border-radius:50px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
      z-index:1;
      position:relative;
    }

    .donate-btn:hover{
      transform:scale(1.08);
      box-shadow:0 5px 15px rgba(255,65,108,0.5);
    }

    .amount-box{
      margin-top:20px;
      z-index:1;
      position:relative;
    }

    .amount-box input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:16px;
      text-align:center;
      margin-bottom:15px;
    }

    .thank-you{
      margin-top:15px;
      color:green;
      font-weight:bold;
      display:none;
      animation:blink 1s infinite alternate;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes blink{
      from{opacity:0.5;}
      to{opacity:1;}
    }
  </style>
</head>

<body>

  <div class="donation-card">

    <h1>DSL & JR Foundation</h1>
    <p>Donate Here</p>

    <div class="scanner-box">
      <!-- Replace with your QR Scanner Image -->
      <img src="IMG-20260507-WA0046.jpg">
    </div>

    


  </div>

  <script>
    function donateNow(){

      let amount = document.getElementById("amount").value;
      let message = document.getElementById("message");

      if(amount === "" || amount <= 0){
        alert("Please Enter Valid Donation Amount");
        return;
      }

      // Dynamic QR Generator
      let upiLink = `upi://pay?pa=yourupi@okaxis&pn=DSLJR&am=${amount}&cu=INR`;

      let qrURL = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiLink)}`;

      document.getElementById("qrImage").src = qrURL;

      message.style.display = "block";

      setTimeout(() => {
        message.style.display = "none";
      }, 4000);
    }
  </script>

</body>
</html>
